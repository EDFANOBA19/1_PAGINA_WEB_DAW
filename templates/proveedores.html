{% extends "base.html" %}

{% block title %}Proveedores{% endblock %}

{% block content %}

<h2 class="text-primary text-center mb-4">🏭 Proveedores</h2>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-info">
            <tr><th>Proveedor</th><th>Especialidad</th><th>Contacto</th><th>Equipos</th></tr>
        </thead>
        <tbody>
            {% for p in proveedores %}
            <tr>
                <td><strong>{{ p.nombre }}</strong></td>
                <td>{{ p.especialidad }}</td>
                <td>{{ p.contacto }}</td>
                <td>{{ p.equipos }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div class="text-center mt-4">
    <a href="{{ url_for('index') }}" class="btn btn-secondary">⬅ Volver</a>
    <a href="{{ url_for('clientes') }}" class="btn btn-primary">👥 Clientes</a>
</div>

{% endblock %}
